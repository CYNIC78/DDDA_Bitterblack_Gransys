; ============================================================================
; ddda_music_map.ini — ЧЕРНОВИК контракта (R2, код ещё не написан)
; ----------------------------------------------------------------------------
; Ключ  = оригинальный путь из STRQ-таблицы (см. docs/generated/BGM_MAP.md),
;         без расширения. Точность ключа критична — включая опечатки Capcom.
; Файлы = 1..N каверов относительно DDDA_AI_Overhaul\music\ (слэш '/').
; При 2+ файлах — случайный выбор при КАЖДОМ запросе трека движком
; (rotation на границе трека; FSM посреди трека не делаем — см.
; docs/AUDIO_MUSIC_RECON.md §3.2.1).
; Ключ отсутствует/файл не найден → играет ваниль (совместимость с
; чужими музмодами и отсутствующими каверами).
; Размер/сэмплы/каналы/лупы патчатся системой автоматически (STRQ R0).
; ============================================================================

[music]
enabled = 0            ; весь музыкальный слой выключается одним флагом

[music.map]
; --- титл (первый стенд; title.arc) ---
bgm\wave2\Tittle_DDN       = title/tittleddn_a.ogg | title/tittleddn_b.ogg

; --- ББИ: боссы первой волны ---
bgm\wave\Demon_1           = bbi/demon1_instr_a.ogg | bbi/demon1_instr_b.ogg
bgm\wave\Shinigami_Battle  = bbi/shinigami_battle_a.ogg | bbi/shinigami_battle_b.ogg
bgm\wave\ShuuzinCycrops    = bbi/shuuzin_cycrops_a.ogg | bbi/shuuzin_cycrops_b.ogg
bgm\wave\Gazer             = bbi/gazer_a.ogg | bbi/gazer_b.ogg | bbi/gazer_c.ogg
bgm\wave\Lich_DragonZonbi  = bbi/lich_dragonzonbi_ext3.ogg
bgm\wave\Upper_ZakoDragon  = bbi/upper_zako_dragon_a.ogg | bbi/upper_zako_dragon_b.ogg

; --- ББИ: боевые тиры (zakocombined → разбить) ---
bgm\wave\Zako_1            = bbi/zako_t1.ogg
bgm\wave\Zako_2            = bbi/zako_t2.ogg
bgm\wave\Zako_3            = bbi/zako_t3.ogg

; --- ББИ: локации ---
bgm\wave\DD_Entrance       = bbi/dd_entrance.ogg
bgm\wave\DD_Kasou          = bbi/dd_kasou.ogg

; --- Грансис ---
bgm\wave\No_018            = gransys/cassardis.ogg
bgm\wave\No_046            = gransys/charedit_a.ogg | gransys/charedit_b.ogg
