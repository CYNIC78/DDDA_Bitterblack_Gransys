################################################################################
#####              DDDA AI Overhaul — Entity Tuning                        #####
#####                                                                      #####
#####  Файл читается на лету. Сохранил — применилось. Игру не перезапускать.
#####  Место: <папка игры>\DDDA_AI_Overhaul\ddda_entities.ini
################################################################################
#
#  КАК ЭТО РАБОТАЕТ — три уровня, значение наследуется сверху вниз:
#
#      [default]        действует на всех врагов
#          |
#      [class.small]    переопределяет для группы видов
#          |
#      [em0100]         переопределяет для конкретного вида
#
#  Пишите ТОЛЬКО то, что хотите изменить. Чего нет в файле — берётся
#  с уровня выше. Пустой файл = поведение ваниллы.
#
#  Группы: small (гоблины, волки, гарпии) | large (огры, химеры)
#          boss (драконы и уникальные)    | other (всё остальное)
#
################################################################################

[global]
### schema — версия формата. Не менять. Нужна, чтобы будущие версии мода
###          понимали старые файлы и не ломали чужие настройки.
schema = 1

### enabled — рубильник всего слоя мутаций. off = чистая ваниль.
enabled = on

### allowWrites — РАЗРЕШИТЬ ЗАПИСЬ В ПАМЯТЬ ИГРЫ.
### off = мод только читает и показывает значения, ничего не меняя.
### on  = мутации применяются к живым врагам.
### Держите off, если просто смотрите. Включайте осознанно.
allowWrites = on


################################################################################
#####  Уровень 1: значения по умолчанию для ВСЕХ врагов
################################################################################

[default]

### --- ЗРЕНИЕ И СЛУХ ---------------------------------------------------------
### 0 = не трогать (значение из файлов игры).
###
### Для гоблина ваниль (из em0100A.sn2):
###     зрение  1500, конус 60 градусов
###     слух    3000
###
### sightAngle: 60 ваниль. ВАЖНО — именно узкий конус делает возможным
###             подкрадывание. Значение выше 120 убивает стелс как класс.
###             Допустимо 10..360.
sightRadius = 0
sightAngle = 0
hearRadius = 0

### --- СКОРОСТЬ ДЕЙСТВИЙ -----------------------------------------------------
### Множитель темпа анимаций. 1.0 = ваниль.
### Каждой особи при спавне достаётся случайное значение из [min..max] —
### разброс НА ОСОБЬ, а не на вид. Два гоблина рядом будут разными.
###
### ЖЁСТКИЙ ПОТОЛОК 1.5. Выше — анимация уходит вперёд хитбокса,
### удары начинают проходить сквозь игрока. Значения зажимаются.
speedMin = 1.0
speedMax = 1.0

### --- РАЗМЕР ОСОБИ ---------------------------------------------------------
### Множитель масштаба. 1.0 = ваниль.
###
### ВАЖНО: это КОЭФФИЦИЕНТ, а не итоговый рост. У Capcom уже есть своя
### вариативность размера (гоблин спавнится с 1.136, а не 1.000), и мы её
### не затираем, а умножаем:  итог = ванильный_размер * коэффициент.
### Поэтому 1.0 действительно оставляет всё как в оригинале.
###
### Каждой особи достаётся своё значение из [min..max], детерминированно:
### один и тот же гоблин всегда одного размера, но соседний — другого.
###
### РАЗМЕР ВЛИЯЕТ НА БОЙ, а не только на вид. Масштабируется вся геометрия:
### радиус замаха, дальность прыжка, досягаемость атак. Мелкий враг может
### физически не дотянуться до игрока, крупный достаёт заметно дальше.
### Учитывайте это при балансе: 0.7 — уже почти безобидный противник.
###
### Диапазон зажат в 0.7..1.4. Ниже модель проваливается в землю,
### выше расходится с хитбоксом.
###
### Пишется в тело (+0x60/64/68) — движок читает эти множители каждый
### кадр, изменение видно сразу, без перезахода.
###
### Требует allowWrites = on.
scaleMin = 1.0
scaleMax = 1.0

### scaleJitter — НЕУНИФОРМНОСТЬ. Движок держит ширину/высоту/глубину
### раздельно, поэтому особи могут отличаться телосложением, а не только
### ростом. 0 = все три множителя равны (просто крупнее/мельче).
### 0.15 = ширина и глубина гуляют на +-15% от высоты: появляются
### коренастые и долговязые. Максимум 0.35.
scaleJitter = 0.0

### --- ПОВОДОК И ВОЗВРАТ ДОМОЙ ----------------------------------------------
### leashScale  — РАБОТАЕТ. Множитель двух таймеров возврата в
###               cCharParamEnemy: +0x100 "время до решения вернуться"
###               и +0x104 "длительность возврата".
###               Это не радиус: игра меряет поводок временем, а не
###               расстоянием. 1.0 = ваниль, больше = преследует дольше,
###               меньше = быстрее теряет интерес и уходит домой.
###
###               Ванильное значение движок ставит сам (в файле 60.0,
###               в памяти 30.0), поэтому мы умножаем на то, что уже
###               стоит, а не заменяем — как и с размером.
###               Разумный предел 0.5..3.0.
###
###               Эффект не виден мгновенно: надо отойти и подождать.
###               Проверять по строке "leash x... activate ... duration"
###               в логе мода.
### returnSpeed — множитель темпа на возврате. В DDON враги возвращаются
###               вдвое быстрее, чтобы не быть беспомощной мишенью.
### returnFight — огрызаться при отходе (гоблин кидает камни).
###               Ванильный баг: на возврате враг НЕ реагирует на урон
###               в спину. Это лечит симптом, не давая неуязвимости.
### returnArmor — DDON Sanctuary: многократная защита при возврате на спавн.
### returnArmorMult — множитель физ/маг брони при возврате (4.0 = 400% защиты).
### returnDamageCut — срез входящего урона (0.80 = -80% урона).
leashScale = 1.0
returnSpeed = 1.30
returnFight = off
returnArmor = on
returnArmorMult = 4.0
returnDamageCut = 0.80

### enabled — выключить мутации для уровня/вида, оставив остальных.
enabled = on


################################################################################
#####  Уровень 2: группы видов
################################################################################

[class.small]
### Мелочь: гоблины, волки, гарпии. Их много, они быстрые.

[class.large]
### Крупные: огры, химеры. Разброс скорости им идёт меньше —
### у тяжёлых атак тайминги критичнее.
speedMax = 1.2

[class.boss]
### Боссы: у них скриптовые фазы. Трогать темп опасно.
speedMin = 1.0
speedMax = 1.0

[class.other]


################################################################################
#####  Уровень 3: конкретные виды
#####  Секция называется em + 4 цифры: гоблин = em0100
################################################################################

[em0100]
### ГОБЛИН — единственный вид, разобранный полностью.
### Ваниль: зрение 1500/60гр, слух 3000, ближняя зона 150.
###
### Раскомментируйте, чтобы попробовать.
### ВНИМАНИЕ: работают scaleMin/scaleMax/scaleJitter и leashScale.
### Остальное пока читается, но не применяется; подтверждённые поля
### перечислены в docs/SOURCE_OF_TRUTH.md и docs/FIELD_MAP.md.
###
### Разброс размеров — самое заметное:
# scaleMin = 0.85
# scaleMax = 1.25
# scaleJitter = 0.15
#
# sightRadius = 2200
# sightAngle = 90
# speedMin = 0.95
# speedMax = 1.25
# returnFight = on

################################################################################
#####  Люди-враги: бандиты, солдаты, разбойники
#####
#####  Это НЕ uEm* — в движке они uHumanEnemy, отдельная ветка иерархии
#####  (uNpc -> uHumanEnemy). Числового em-номера у них нет, поэтому
#####  секция называется словом.
################################################################################

[human]
### Осторожно с размером: люди носят броню и оружие, у них человеческие
### пропорции. Разброс, незаметный на гоблине, на человеке бросается
### в глаза. Начинайте с малого.
# scaleMin = 0.95
# scaleMax = 1.10
# scaleJitter = 0.05
#
### Бандиты дерутся у своего лагеря — им поводок особенно идёт.
# leashScale = 1.5

[em0101]
### Хобгоблин. HP 2000 (em0101.rst), тёмный урон ×0.6.
### Сенсоры против em0100: ближняя зона 170 vs 150, слух 1000 vs 3000.

[em0102]
### Гримгоблин. HP 6000 (em0102.rst), молния ×0.5, тьма ×0.5.

[em0103]
### Большой гоблин / Шаман гоблинов (Greater Goblin / Goblin Shaman, BBI).


################################################################################
#####  Шпаргалка по безопасным диапазонам (проверено на живых данных)
#####
#####    scaleMin/Max   0.7 .. 1.4   размер особи (РАБОТАЕТ)
#####    scaleJitter    0.0 .. 0.35  неуниформность телосложения
#####    speedMin/Max   0.5 .. 1.5   выше — рассинхрон хитбокса
#####    sightAngle      10 .. 360   выше 120 — стелс не работает
#####    sightRadius      0 .. 6000  ваниль гоблина 1500
#####    hearRadius       0 .. 8000  ваниль гоблина 3000
#####    leashScale     0.0 .. 10.0
#####
#####  Значения вне диапазона не ломают игру — они зажимаются,
#####  а подмена пишется в ddda_ai_overhaul.log.
################################################################################
