################################################################################
#####                    DDDA AI Overhaul Mod                              #####
#####              Place ddda_ai_overhaul.ini in the DDDA folder           #####
################################################################################

[main]
### Load additional library
###  - for chaining with other dinput8 mods
###  - set to the original dinput8 mod's dll name if you want both
loadLibrary = 

[hotkeys]
### Hotkeys — REQUIRED for F12 overlay to work!
###  - 'enabled'   - must be ON
###  - 'keyUI'     - F12 key code (0x7B = F12)
###  - 'menuPause' - delay in ms for menu hotkeys
enabled = on
keyUI = 0x7B
menuPause = 500

[pawnAI]
### Pawn AI Overhaul
###  - 'enabled'         - master switch
###  - 'presetsEnabled'  - use inclination presets / custom anchors
###  - 'sanitary'        - Phase 1.3: prevent junk (Guardian/Nexus/Acquisitor) from dominating
###                        Dynamic cap = 3rd highest useful inclination
###  - 'smartUtil'       - Phase 1.4: adjust Utilitarian based on pawn knowledge (mStudyFlag)
###  - 'preset'          - 0=Boss Killer, 1=Crowd Ctrl, 2=Tactical, 3=Ranged, 4=Explorer, 5=Balanced, 6=Custom Anchor
###  - 'smooth'          - transition smoothness LERP (0.01=soft slow, 0.1=normal, 1.0=instant)
###  - 'tactical'        - auto-adapt preset in combat based on enemy category
enabled = on
presetsEnabled = on
sanitary = on
smartUtil = on
tactical = on
preset = 5
smooth = 0.10

[customAnchor]
### Custom Inclination Anchors (0 - 1000)
### Used when preset = 6 (Custom Anchor) or when dragging sliders in F12 menu
scather = 750.0
medicant = 400.0
mitigator = 500.0
challenger = 700.0
utilitarian = 750.0
guardian = 350.0
nexus = 350.0
pioneer = 400.0
acquisitor = 250.0
skillUse = 700.0

[targetLock]
### Target Lock — автонаведение мили-атак по камере
###  - 'autoAim'    - snap melee attacks to camera direction
###  - Alt+X to capture player physics (once per session)
###  - NumPad Del (VK_DELETE 0x2E / VK_DECIMAL 0x6E) to toggle auto-aim (was F5)
autoAim = off

[camera_keys]
### Camera Plus — custom key bindings
### Virtual-Key Codes: https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
###   F4 = 0x73, MMB = 0x04, Num0 = 0x60, Num+ = 0x6B, Num- = 0x6D
###   Mouse buttons: LMB=0x01, RMB=0x02, MMB=0x04, X1=0x05, X2=0x06
###   Set to 0xFF to disable
freeCam = 0x04
pause   = 0x60
speedUp = 0x6B
speedDn = 0x6D

[camera]
### Camera Plus — свободная камера + пауза
###  - 'freeCam'     - enable free camera (F4 toggle)
###  - 'detach'      - detach camera from player
###  - 'freeFly'     - enable free fly mode
###  - 'flySpeed'    - movement speed (arrows)
###  - 'flySpeedZ'   - vertical speed (PgUp/PgDn)
###  - 'pause'       - game pause toggle (Num 0)
###  - 'pauseSpeed'  - speed during pause (0.00001 = frozen, 0.1 = slow-mo)
freeCam = off
detach = off
freeFly = off
flySpeed = 2.0
flySpeedZ = 2.0
pause = off
pauseSpeed = 0.0001

[combatIntel]
### Combat Intel — боевая разведка
###  - 'enabled'      - hook ALL damage events, track enemies in combat
###  - 'timeout'      - seconds before enemy considered "out of combat"
###  - hooks 3 damage signatures from dinput8 DamageLog
###  - WARNING: may conflict with DamageLog from original dinput8
enabled = on
timeout = 5

[enemyAI]
### Enemy AI Overhaul
###  - 'enabled'           - master switch
###  - 'aggression'        - aggression multiplier (1.0 = default, >1 = more aggressive)
###  - 'reactionSpeed'     - reaction speed multiplier
###  - 'maxAttackers'      - max enemies attacking simultaneously
###  - 'smarterTactics'    - enable smarter group tactics
enabled = on
aggression = 1.3
reactionSpeed = 1.2
maxAttackers = 5
smarterTactics = on

[nightmare]
### Nightmare Module — Bitterblack Gransys
###  After killing Daimon's second form, Gransys transforms:
###  - Eternal night falls upon the land
###  - Weather becomes dark and volcanic
###  - Gransys enemies are replaced with Bitterblack Isle variants
###  - 'enabled'        - master switch for this module
###  - 'triggered'      - set to 'on' after Daimon-2 kill (manual for now)
###  - 'eternalNight'   - lock time to night hours
###  - 'darkWeather'    - force volcanic/fog weather
###  - 'forcedHour'     - which night hour to lock (0-5)
###  - 'replaceEnemies' - swap Gransys enemies for BBI variants
enabled = off
triggered = off
eternalNight = on
darkWeather = on
forcedHour = 2
replaceEnemies = on

[devtools]
### Type Atlas / factory probe (F12 → DevTools)
###  - 'enabled'   - show the panel
### After load: SCAN (vtable map) then DUMP sUnit anatomy.
### DUMP writes ddda_sunit_dump.json — that is the file to paste.
enabled = on
autoDump = on

[inGameUI]
### In-game UI overlay (F12)
enabled = on

