; A profile has ruleCount=0..48. Each profile.ruleN section identifies one
; cCodeParam by the complete cPrioParam tuple plus personality ruleIndex.
; All expected fields are validated before ANY rule in the profile is written.
; Profiles are applied transactionally and rolled back to expectedAddS32.
