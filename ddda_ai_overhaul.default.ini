### =====================================================================
### [errata] - STATIC FIXES OF BROKEN VANILLA RULES (layer B)
###
### This is NOT the doctrine. The doctrine turns inclination weights by
### situation, the way the design intends. Errata lifts a rule that should
### not exist at all. See docs/ERRATA_ARCHITECTURE.md.
###
###  - 'guardianDaggerBan' - lift the Guardian primary -3 on WpnDaggerAtk
###    (priority code 54). Vanilla gives a dagger pawn with Guardian primary
###    exactly zero melee: 12467 combat frames, zero dagger attacks.
###    OFF by default (vanilla).
###  - 'guardianDaggerValue' - what to write instead of -3.
###      0  = the ban simply removed
###     +2  = what made the pawn fight with daggers in log 17
###     +5  = what Scather primary carries
### =====================================================================
###  - 'nexusMagicBan' - lift the Nexus -3 / -2 on WpnWandAtk (priority code
###    55). Same construction as the Guardian one, but for casters: the
###    inclination meant to make her look after a party member ends up telling
###    her not to cast. NOT measured in combat yet - the rule map is certain,
###    the effect is not.
###  - 'nexusMagicValue' - what to write instead.
### =====================================================================
[errata]
guardianDaggerBan = off
guardianDaggerValue = 0
nexusMagicBan = off
nexusMagicValue = 0

