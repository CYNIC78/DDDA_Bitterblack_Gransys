[main]
### Load additional library
###  - for chaining with other dinput8 mods
###  - set to the original dinput8 mod's dll name if you want both
loadLibrary = 

[hotkeys]
### Hotkeys — REQUIRED for F12 overlay to work!
###  - 'enabled'   - must be ON
###  - 'keyUI'     - F12 key code (0x7B = F12)
###  - 'menuPause' - delay in ms for menu hotkeys
enabled = on
keyUI = 0x7B
menuPause = 500

[pawnAI]
### Pawn AI Overhaul — модель весов v3.0
###  - 'enabled'         - master switch
###  - 'presetsEnabled'  - use anchors (sliders). OFF = weights freeze where they are
###  - 'acquisitor'      - soft manager for Acquisitor ONLY: suppressed in combat;
###                        after combat ends, temporarily boosted (loot vacuum),
###                        then smoothly returned home to the player's slider.
###                        Guardian/Nexus are doctrines now and are NOT capped.
###  - 'acquisitorCombatFloor'   - Acquisitor cap during combat (0..1000)
###  - 'acquisitorLootBoost'     - additive boost; base 250 + 650 = target 900
###    85.11: main pawn only; existing INI values are preserved, edit manually.
###  - 'acquisitorBoostWindowMs' - how long the post-combat boost lasts (ms)
###  - 'acquisitorReturnMs'      - how long the smooth return home takes (ms)
###  - 'smartUtil'       - adjust Utilitarian based on pawn knowledge (mStudyFlag)
###  - 'smooth'          - transition smoothness LERP (0.01=soft slow, 0.1=normal, 1.0=instant)
###  - 'tactical'        - auto-adapt: situational delta on top of your sliders (enemy category)
###  - 'lastPreset'      - which preset was loaded into the sliders last (UI indicator only)
###  Sliders ([customAnchor] below) are ALWAYS the truth. Presets just load into them.
enabled = on
presetsEnabled = on
acquisitor = on
acquisitorCombatFloor = 100.0
acquisitorLootBoost = 650.0
acquisitorBoostWindowMs = 20000
acquisitorReturnMs = 4000
###  - 'worldUnitsPerMeter' - scale of world coordinates (Guardian doctrine).
###                          DDDA world units are ~centimeters, so 100.0 = 1 m.
###                          Evidence: AIPlActParam action ranges 500..4000 and
###                          goblin vision sensor 1500 only make sense as cm.
###                          Exact factor TBD by touch-test; tune here if needed.
worldUnitsPerMeter = 100.0
###  - 'guardianFix' - Build 57.1: dynamic Guardian fix. OFF by default (vanilla).
###                   When ON, lifts Guardian -3 penalty on WpnDaggerAtk (code 54)
###                   transactionally, ONLY while a threat is in the Arisen's
###                   zone and the pawn is melee/hybrid. Rollback when zone clears.
###  - 'guardianMeleeRadius' - Build 57.3: melee intercept radius in meters.
###                   The fix only arms when the nearest threat is WITHIN this
###                   radius (dagger range). Beyond it the pawn keeps the bow
###                   (code 57 has no inclination penalties — SOURCE_OF_TRUTH §3.5.3).
###  - 'guardianPreemptRadius' - Build 58: bodyguard "preempt" zone (meters).
###                   Larger than melee radius. When nearest threat is inside
###                   this, the dagger penalty is removed (pawn "readies" melee)
###                   even before the enemy reaches melee range.
###  - 'guardianDaggerBiasMelee'   - desired AddS32 when threat in melee radius
###                   (default +2 = slight bonus, pawn commits to intercept).
###  - 'guardianDaggerBiasPreempt' - desired AddS32 when threat in preempt radius
###                   (default 0 = penalty removed, pawn readies).
guardianFix = off
guardianMeleeRadius = 6.0
guardianPreemptRadius = 10.0
guardianDaggerBiasMelee = 2
guardianDaggerBiasPreempt = 0
###  - 'guardianMinRank' - 85.12: minimum Guardian RANK for a pawn to count as
###                   a guardian and receive the doctrine. 2 = primary,
###                   1 = secondary, 0 = tertiary, -1 = outside the stack.
###                   Several guardians in one party is normal: each pawn is
###                   judged by its OWN stack, pawns are never compared with
###                   each other. Default 1: a tertiary inclination barely
###                   affects behaviour and must not switch the doctrine on.
###  - 'guardianMinIncl' - minimum WEIGHT of that same inclination (0..1000).
###                   Values below 350 are cut by the binder's own check anyway
###                   (GUARDIAN_HARDENING.md, 85.10).
###  - 'guardianTelemetryMs' - how often to print one state line per guardian
###                   (0 = never). The line carries pawn->enemy, pawn->Arisen,
###                   the side (FRONT/BACK), the live planner goal and its code.
guardianMinRank = 1
guardianMinIncl = 350.0
guardianTelemetryMs = 0
### guardianProbeLog: event-only WAKE/INTERCEPT START+RESULT, no periodic spam.
### off = no probe logs; doctrine unchanged.
guardianProbeLog = on
### nexusProbeLog: Nexus START/RESULT once per window (~2 lines / 10.5 s),
### without per-tick sampling; off = no probe, doctrine remains active.
nexusProbeLog = on
smartUtil = on
tactical = on
lastPreset = 5
smooth = 0.10

### --- Вокационный кордон Guardian --------------------------------------
### Guardian как доктрина телохранителя осмысленна только у ближнего боя.
### У лучника и кастера активный Guardian вреден: пешка прижимается к
### Аризену и стреляет из-за его спины, то есть тащит агро прямо на него.
###
###   Fighter / Warrior / Mystic Knight - не трогаем
###   Strider / Assassin                - частичный кордон
###   Ranger / Magick Archer            - полный кордон
###   Mage / Sorcerer                   - полный кордон
###
### Кордон задаёт ПОТОЛОК склонности, а не вычитает число: поставил
### Guardian ниже потолка сам — кордон молчит.
###
### Pioneer — грубый рычаг «не липни к якорю». Настоящее позиционирование
### (фланг, огонь из тыла) требует реверса цели Follow — отдельная задача.
