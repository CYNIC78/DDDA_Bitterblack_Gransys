###############################################################################
#####  РАНГИ ОСОБЕЙ: СТУПЕНИ ВМЕСТО РАВНОМЕРНОГО КОРИДОРА (85.40, имя с 85.42)
#####
#####  ЗАЧЕМ. Раньше каждая особь тянула рост из коридора вида равномерно
#####  (1.00..1.15), и «кто тут главный» глазом не читалось: рядовой и вожак
#####  отличались на пару процентов. Поле 29.09 подтвердило: ЧИСЛАМИ короносец
#####  от рядового неотличим. Единственный прибор у игрока — глаз. Поэтому рост
#####  становится СТУПЕНЬЮ, а не лотереей:
#####
#####      новичок -> солдат -> ветеран -> элита -> мини-босс
#####
#####  Ступень выбирается по адресу тела, детерминированно: внутри боя она не
#####  мигает, но с солью сессии — между заходами пачка перетасовывается.
#####
#####  КАК ВКЛЮЧИТЬ ВИД. Одна строка в его секции:  ranks = on
#####  Волку, хобу и ящеру ключ не читается вообще: их размер неприкосновенен.
#####
#####  ЧИСЛА РАНГОВ (ниже). Размер — полоса роста, атака — множитель к
#####  ванильной атаке вида (поверх неё работают ваши ×N и ролл особи).
#####  Вес = доля пачки на ранг; это ЛОТЕРЕЯ, а не гарантия (сумма весов = 1).
#####  При весе 0.02 на пачку из 10 тел выходит 0-1 мини-босс в среднем, но
#####  изредка 2-3. Если нужен жёсткий предел — скажи, сделаю счётчик на пачку.
#####
#####  ЧЕГО РАНГИ НЕ ДЕЛАЮТ: HP не трогают; потолки разгона по приказу
#####  пока не поднимает (следующий шаг); ниже ванили не опускает — новичок
#####  ходит с ВАНИЛЬНОЙ атакой, он младший, а не ослабленный.
###############################################################################

[ranks]
### Ранг 1 — новичок: младший в пачке, атака ванильная.
rank0Weight  = 0.34
rank0SizeMin = 0.95
rank0SizeMax = 1.03
rank0Atk     = 1.00
### Ранг 2 — солдат: основной боец пачки.
rank1Weight  = 0.46
rank1SizeMin = 1.03
rank1SizeMax = 1.07
rank1Atk     = 1.09
### Ранг 3 — ветеран: 1-2 на пачку, читается по размеру.
rank2Weight  = 0.13
rank2SizeMin = 1.07
rank2SizeMax = 1.12
rank2Atk     = 1.20
### Ранг 4 — элита: редко, заметно крупнее и злее.
rank3Weight  = 0.05
rank3SizeMin = 1.12
rank3SizeMax = 1.18
rank3Atk     = 1.35
### Ранг 5 — мини-босс: 0-1 на пачку, редко. Рост 1.25 при пределе движка 1.40:
### выше расходится хитбокс, не поднимать.
rank4Weight  = 0.02
rank4SizeMin = 1.18
rank4SizeMax = 1.25
rank4Atk     = 1.52

### КРЕПОСТЬ РАНГА (85.47). Ключ = «во сколько раз крепче»: 1.00 = РОВНО
### ВАНИЛЬ, ниже 1.00 зажимается обратно. Поля в игре — ЗАПАСЫ, поэтому
### крепче = больше (код умножает).
###   rankNResist — сопротивления дебаффам: горение, яд, сон, немота, проклятие,
###                 окаменение, заморозка, оглушение, понижение статов и т.д.
###   rankNStand  — отшатывание и сбивание с ног.
###
### ЛЕСТНИЦА ОТКАЛИБРОВАНА ПО ХОБГОБЛИНУ. Владелец: «мини-босс-гоблин — чемпион
### в лёгком весе, новичок-хоб — новичок в следующей категории, цель примерно
### половина стат хоба». Родные числа: гоблин горит на 300 и падает от 100, хоб —
### 2000 и 650. Половина хоба = 1000 и 325, то есть ×3.3 и ×3.25. По этой мерке
### построены все ступени (доля хобгоблина по самому слабому полю — огню):
###
###   ступень     доля хоба   Resist   Stand   горение   сбивание
###   новичок        0%        1.00     1.00      300       100   (ровно ваниль)
###   солдат        20%        1.35     1.30      400       130
###   ветеран       30%        2.00     1.95      600       195
###   элита         40%        2.65     2.60      800       260
###   мини-босс     50%        3.30     3.25      990       325   (половина хоба)
###
### ЧЕСТНАЯ ОГОВОРКА: у остальных полей соотношение гоблин/хоб иное (яд 3.0,
### окаменение 3.6, заморозки 4.4), а ручка одна. Поэтому по яду и сну мини-босс
### догоняет хобгоблина целиком, а по огню и сбиванию выходит ровно половина.
### Огонь при этом продолжает кусаться: 990 против 2000 у хоба.
### Поля, которые игра уже сделала почти иммунными (одержимость и печать навыков,
### по 10000), код НЕ трогает вовсе.
### Всё это правится здесь без пересборки. Хочешь вернуть «только смотреть» —
### поставь все десять ключей в 1.00.
rank0Resist = 1.00
rank0Stand  = 1.00
rank1Resist = 1.35
rank1Stand  = 1.30
rank2Resist = 2.00
rank2Stand  = 1.95
rank3Resist = 2.65
rank3Stand  = 2.60
rank4Resist = 3.30
rank4Stand  = 3.25

[species.uEm0200]
### ВОЛК: РАНГИ ВКЛЮЧЕНЫ, НО РАЗМЕР НЕ ТРОГАЕМ.
###
### rankScale = off — ключ специально для волка: ступень даёт ему АТАКУ и
### КРЕПОСТЬ, а рост остаётся ванильным. То есть волки-гиганты не появятся:
### работает родной коридор вида, а крупные ванильные вожаки сохраняются как
### раньше. Хочешь и рост по ступеням (как у гоблина) — поставь rankScale = on.
###
### ЧТО ЭТО ДАЁТ ПО ЧИСЛАМ. Родные запасы волка: яд 600 · ГОРЕНИЕ 400 ·
### заморозка 800 · отшатывание 100 · сбивание 100. Со ступенями:
###     солдат    яд 810   · горение 540  · сбивание 130
###     ветеран   яд 1200  · горение 800  · сбивание 195
###     элита     яд 1590  · горение 1060 · сбивание 260
###     мини-босс яд 1980  · горение 1320 · сбивание 325
### Для сравнения: у хобгоблина горение 2000 и сбивание 650 — даже волк-мини-босс
### остаётся мягче хоба. Атака растёт как у гоблина (×1.09 … ×1.52).
###
### Выключить волка совсем: ranks = off (тогда ни ступеней, ни крепости).
ranks = on
rankScale = off
