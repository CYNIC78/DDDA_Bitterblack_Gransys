[monsterTempo]
### Вариативность темпа передвижения монстров.
###
### ЗАЧЕМ: игрок побеждает гоблина не потому, что тот слаб, а потому что
### выучил его ритм. Каждый монстр получает СВОЙ множитель скорости, поэтому
### стая подходит вразнобой и дистанцию выучить нельзя. Урон и HP не трогаются.
###
### Эта первая ручка меняет только локомоцию тушки. Темп атак ниже —
### отдельная attacks-only ручка; урон и HP обе ручки не меняют.
### Build 008 фиксирует здесь любимый профиль из принятого live-теста.
###
###  - 'enabled'    - включить режим
###  - 'factorMin' / 'factorMax' - диапазон множителей скорости. Каждому
###                   монстру достаётся своё значение внутри него, поэтому
###                   стая идёт вразнобой. Примеры:
###                     1.05 / 1.20  - принятый профиль (по умолчанию)
###                     1.00 / 1.25  - все не медленнее ванили, кто-то шустрее
###                     0.80 / 1.05  - крадущаяся стая
###                   Жёсткие пределы 0.75 и 1.30 независимо от этих чисел:
###                   дальше заметно проскальзывание стоп и пробой коллизии.
###  - 'hookWalk'   - общий подтверждённый канал: dash/track, run и walk.
###  - 'hookSprint' - отдельный необязательный путь спринта. Build 008
###                   оставляет его выключенным: принятый профиль не требует
###                   этого пути, и отдельный sprint hit не служит критерием.
enabled = on
factorMin = 1.05
factorMax = 1.20
hookWalk = on
hookSprint = off

### ТЕМП АНИМАЦИИ — вторая, независимая ручка (найдена 19.08.2026).
###
### В теле существа лежит ряд из пяти множителей скорости воспроизведения
### (+0x0EE4…+0x0EF4). В норме каждый равен 1.0, торпор ставит 0.5. Мы
### умножаем на свой коэффициент, а не задаём абсолют, поэтому торпор,
### захват и прочие механики продолжают работать поверх нашей правки.
###
### Здесь меняется ИМЕННО ритм боя: замах, удар и восстановление. Самое
### слабое звено гоблина — долгий замах; вариативность темпа лишает игрока
### заученного окна для уворота.
###
### Множитель у каждой особи свой и не зависит от множителя передвижения,
### поэтому получаются четыре характера:
###     медленно ходит + медленно бьёт  - увалень
###     быстро ходит   + медленно бьёт  - наскок-отскок
###     медленно ходит + быстро бьёт    - засадный
###     быстро ходит   + быстро бьёт    - берсерк
###
### Жёсткие пределы 0.70 и 1.40 независимо от этих чисел: дальше окно
### уязвимости и хитбоксы оружия перестают читаться глазом.
### ВАЖНО ПРО ОБЛАСТЬ. Множитель воспроизведения ГЛОБАЛЕН для существа:
### сам по себе он ускоряет всё анимированное, включая ходьбу. Но скоростью
### ходьбы уже управляет хук передвижения выше, и две ручки крутили бы одно
### и то же.
###
### Поэтому 'animAttacksOnly = on' (по умолчанию): множитель применяется
### ТОЛЬКО пока текущее действие является атакой. Тогда ручки честно
### разделены:
###     factorMin/Max      - как быстро монстр перемещается;
###     animFactorMin/Max  - как быстро он замахивается и бьёт.
### Выключать стоит только для экспериментов «весь монстр в ускорении».
animEnabled = on
animAttacksOnly = on
animFactorMin = 1.05
animFactorMax = 1.15

### СВЯЗКА ХАРАКТЕРА: 0.0 … 1.0.
###
### Полная независимость ручек даёт четыре характера, но и несуразицу:
### гоблин-спринтер с ванильным замахом читается как «быстро прибежал и
### застыл». Связка задаёт, в какой мере темп атаки следует за скоростью
### передвижения ТОЙ ЖЕ особи:
###     0.0 - ручки независимы (четыре характера);
###     1.0 - кто быстро бегает, тот быстро и бьёт (цельное существо);
###     0.5 - смесь.
animCoupling = 0.00

[pawnHaste]
### Рывок пешки в бою.
###
### ПРОБЛЕМА. У пешек в бою нет спринта вообще. Причина найдена в данных:
### даш существует отдельным действием GOAP, но привязан только к цели
### Follow (догнать Аризена) и к Escape. На боевых целях его нет —
### планировщику нечего выбрать. См. docs/PAWN_SPRINT_RECON.md.
###
### ЧТО ДЕЛАЕМ. Планировщик не трогаем. Пока пешка закрывает дистанцию до
### врага, ей поднимается тот же множитель ПЕРЕДВИЖЕНИЯ, что и монстрам.
###
### ЧЕСТНО: это подделка. Анимация остаётся джогом, ускоряется только
### перемещение тушки. Поэтому потолок 1.30 — дальше видно проскальзывание.
###
###  - 'factor'        - множитель скорости на время рывка
###  - 'minDistanceM'  - ближе этого рывок не нужен: пешка уже в контакте
###  - 'maxDistanceM'  - дальше это уже не бой, а переход, и там у пешки
###                      работает штатный даш по цели Follow
###
### СВЯЗКА АНИМАЦИИ ('animCouple'). Замечание тестера: у монстров мы умеем
### ускорять И перемещение, И анимацию — ряд множителей воспроизведения
### +0x0EE4…+0x0EF4. Если тот же ряд есть в теле пешки, проскальзывание
### стоп лечится: анимация бега ускоряется вместе с перемещением.
###
### Порядок безопасный:
###   1. при первом рывке ряд ЧИТАЕТСЯ и вердикт печатается в лог
###      («Tempo: anim row probe uCmc ... -> ...»), запись при этом не
###      выполняется вообще;
###   2. запись включается только этим флагом И только если все пять
###      полей были ровно 1.0 (ряд на месте и в покое);
###   3. когда рывок кончается, исходные значения возвращаются.
###
### Вердикт получен на живой пешке (ряд есть, поле [0] — темп
### передвижения), запись сужена до этого поля и до состояний движения,
### исходные значения возвращаются. Поэтому по умолчанию ON: выключенная
### связка — это заведомо худший вариант с широкими шагами.
###
### КОМПЕНСАЦИЯ, А НЕ БАФФ ('matchMonsterTempo'). Модуль существует
### потому, что монстров ускорили МЫ. Значит и число правильно брать у
### них: при включённом флаге множитель равен множителю самого быстрого
### врага поблизости, а если монстры бегут ванильно — компенсации нет
### вовсе. 'factor' в этом режиме не используется.
enabled = off
factor = 1.20
minDistanceM = 5.0
maxDistanceM = 40.0
animCouple = on
matchMonsterTempo = on
###
### ПРИЗНАК БОЯ У САМОЙ ПЕШКИ ('requireWeaponDrawn'). «Враг в радиусе» —
### грубая метка: враги за стеной, которых партия не видит, включали
### ускорение. У пешки есть свой признак: состояния с обнажённым оружием
### (cPlActHoldWeaponMv при движении, семейство cPlActWpn* при ударах).
### Гейт: обнажённое оружие ИЛИ подтверждение детектора боя.
requireWeaponDrawn = on

[monsterAI]
### Build 012 keeps the accepted absolute-HP PackMark and universal table-driven
### restraint recipes, then carries exact target + normalized urgency through the
### complete Director order. Aggro consumes the exact target; Tempo owns one bounded,
### non-stacking mobilization envelope for each exact free responder.
###
### 2026-09-25 — urgency больше не 1.0 у всех событий, она разная и это чистый
### множитель ТЕМПА (сила агро берётся из тира ALERT/ALARM, не отсюда):
###   вплотную (прижали/подняли/схватили, 2-2.5 м) ....... 1.0
###   зов издалека (рог/вой, 10-14 м) .................... 0.65
###   чужой каст рядом ................................... 0.55
### Порядок включения и что смотреть в логе — docs/TEMPO_SYSTEM.md §0.
###
### m=0 is that body's immutable assigned stable locomotion/attack pair. m=1 is
### its deterministic personal rage endpoint (wolf locomotion 1.20..1.25,
### attack-only animation 1.20..1.26). Admission rises to m=1 and holds while the
### command remains admitted. Ordinary evidence completion releases to a linear
### 1400 ms decay. Identity/species/readiness/topology loss, stale world state,
### timeout, rollback, disable, or shutdown immediately hard-reset Director rows.
### Generic Tempo overrides still compose afterward and final species-safe clamps
### always apply. Refresh never snapshots a transitional factor or moves endpoints.
###
### ALERT and ALARM both request full mobilization but remain tactically distinct:
### GrabStart ALERT is pin-only with max 750 ms evidence lease; independently
### sufficient Hagaijime4Feet ALARM uses pin+suppress+fake-hit for max 4000 ms;
### literal lift stays a separate ALARM with max 2500 ms. The exact paired wolf is
### excluded, and continuation stays attached to the originally admitted pair.
###
### 'enabled' arms observation. Existing 'wolfActuator' remains the only gameplay
### consent and defaults OFF; no new F12 control was added. Ground pin, standing
### hold, and literal lift stay separate. Guardian behavior, accepted stable Tempo
### profile, HP, damage, stagger, immunity, inclinations, and native combat remain
### unchanged outside admitted orders.
enabled = off
wolfActuator = off

###
### 'responderMax' — СКОЛЬКО особей получает приказ директора (85.23).
### 0 (по умолчанию) = все подходящие, как было раньше. N = N ближайших к очагу:
### событие «выручай собрата» берёт тех, у кого жертва перед глазами, а не всю
### округу. Ограничение действует и на темп (кого разгоняем), и на наведение
### (кого сажаем на помеченную пешку); остальные остаются при своих целях.
### Ключ добавлен 85.23; в старом ini он появится сам, со значением 0.
responderMax = 0

### 'chantNearest' — «услышал каст» берёт БЛИЖАЙШЕГО монстра (85.25).
### Механизм: пешка кастует, монстр этого вида слышит и злится. Раньше правило
### требовало РОВНО ОДНУ пару «кастующий ↔ монстр» в радиусе и в толпе просто
### отказывало: в поле это дало 36 отказов против 4 срабатываний, все отказы —
### «рядом больше одного». Теперь, если пар несколько, берётся ближайший.
### 1 (по умолчанию) = так и делать; 0 = прежнее строгое поведение (нужна ровно
### одна пара, иначе события нет).
### ВАЖНО: на «выручай собрата» (хваты, прижимы, подъём) это НЕ действует и не
### будет: там уникальность пары доказывает, кого именно держат.
### Ключ добавлен 85.25; в старом ini он появится сам, со значением 1.
chantNearest = 1

### 'fallenGuardRadius' — ВСТРЕЧА У ТЕЛА ПАВШЕЙ ПЕШКИ (85.27; переделано в 85.28).
### Механизм: упал товарищ, вы идёте его поднимать — и толпа, стоящая у тела,
### разворачивается на ВАС, а не провожает взглядом. Подъём в DDDA мгновенный
### (спринт и касание), поэтому наказывается не подъём, а ПОДХОД к телу.
### Радиус — расстояние ОТ ВАС до тела, в метрах, при котором включается встреча.
### 10 (по умолчанию) = монстры успевают развернуться и дойти даже против
### спринта. 8 = мягче, 14 = жёстче, 3 = почти незаметно, 0 = выключено совсем.
### Держится около 4 секунд и снимается сразу: пешку подняли или вы ушли.
### СБИТАЯ С НОГ пешка (на земле, но в сознании) сюда НЕ входит: её добивают
### монстры, см. ключ pawnFinish ниже.
### Это настоящий приказ директора (внимание + аренда темпа исполнителям), как
### рог и хват. Ключ добавлен 85.27; в старом ini он появится сам со значением 10.
fallenGuardRadius = 10

### 'pawnFinish' — ДОБИВАНИЕ ЛЕЖАЩЕЙ ПЕШКИ (85.30).
### Пешка сбита с ног, но В СОЗНАНИИ: лежит на земле и встанет сама через секунду.
### Окружающие монстры разворачиваются НА НЕЁ и добивают — чтобы выключить её из
### боя и не дать подняться. Цель здесь — САМА ПЕШКА, а не игрок.
### Ключ fallenGuardRadius к этому не относится: там радиус от игрока до тела, тут
### работает близость монстров к пешке (10 м).
### 1 = включено (по умолчанию), 0 = выключено. Меняется после перезапуска игры.
pawnFinish = 1

### 'parallelOrders' — ПАРАЛЛЕЛЬНЫЕ ПРИКАЗЫ (85.33).
### ОДНОВРЕМЕННЫЕ события: трубит горнист, и в тот же момент упала пешка.
### Директор считает оба события и ДЕЛИТ пачку по простому правилу: каждая особь
### идёт к тому событию, которое БЛИЖЕ к ней. Кто ближе к телу пешки — добивает
### её, кто ближе к рогу — идёт на вас. Так пачка перестаёт быть одной кучей и
### реагирует сразу на две вещи, а математика сама решает, кому куда.
### Правило то же, что и в выборе главного события: близость = важность.
### Ограничения честно: делится только ВНИМАНИЕ (агрессия). Замах, темп и удар
### по-прежнему у главного события; второй приказ добегает и бьёт сам.
### 0 (по умолчанию в этой сборке) = директор считает деление и ПИШЕТ его в лог
### строкой SPLIT, но мир не меняет: сначала посмотрите лог, потом включайте.
### 1 = деление исполняется (часть пачки реально уходит на второе событие).
### Меняется после перезапуска игры. В старом ini появится сам со значением 0.
parallelOrders = 0



[aggro]
### Прибор «на кого смотрит пачка» (docs/AGGRO_RECON.md, этап 1).
###
### Наблюдательный путь только читает. Ручные PIN/FOCUS ниже — отдельные
### исследовательские мутации и работают лишь при явном watch = on.
###
### Ищет в теле врага слоты, которые ссылаются на членов партии, и считает,
### какой из них МЕНЯЕТ члена. Смысл в том, что ссылок на игрока в теле
### несколько, и почти все они — постоянные связи, а не цель. Цель — тот
### слот, который двигается. Оффсет не задан заранее: он результат замера.
###
### Полный обход тела делается при появлении особи и раз в 5 секунд;
### в обычном тике перечитываются только найденные слоты.
###
### Зачем включать: замер приманки (Stamina Hammer) и провокации
### (Shield Drum / War Cry). Кнопки MARK в панели режут лог на A и B.
### Monster Director может держать тихий read-only observer lease при
### watch = off. Director получает право записи только через отдельную
### wolfActuator lease с exact-body validation; observer demand сам по себе
### по-прежнему не даёт права записи. Ручные PIN/FOCUS на время lease сняты.
watch = off

### Детальные successful per-card readback и shape-census строки — opt-in.
### При off автоматическими остаются transitions, bounded summaries, unsafe
### skips, rollbacks и shutdown footer; snapshot/roster доступны вручную.
logEvents = off

### CARDWATCH (79.0): непрерывное слежение за карточками двух особей —
### кандидаты в поля карточки И живая дистанция до члена карточки в одной
### строке. Только при изменении (дельта) или по сердечнику раз в 4 с.
### Именно на этих строках видно, какое поле карточки ЕСТЬ дистанция, а
### какое — ненависть: два ручных «roster diff» (78.0) их не развели.
cardwatch = off

### PIN (80.0): «штырь внимания» — первая мутация трека (AGGRO_RECON §20).
### Каждый тик переписывает поле внимания +0x10 = 300 (нативное значение
### линии 300-10d при 0 м) в карточках выбранного члена партии.
### Только uEm0200 (единственный вид с верифицированной картой).
### Readback + откат; снятие = stop re-asserting, затухание движка
### доводит поле до нуля за ~5 c. По умолчанию ВЫКЛЮЧЕН.
### off | Arisen | MainPawn | Hired1 | Hired2
pin = off
### nearest | all  (ближайший к члену волк | вся пачка uEm0200)
pin_scope = nearest
### off | on  (81.0: гасить прочие живые карты той же особи до 0 —
### тогда аргмакс внимания становится чистым и цель «прилипает»);
### замер 80.0: без подавления штырь даёт мягкий сдвиг вектора стаи
pin_suppress = off
### off | on  (82.0: фейк-хит — пере-заявка «свежего урона» в блоке B
### заштыренной карты: 274=1, 27c=значение. Блок B восприниманием не
### сбрасывается (в отличие от +0x10, §23), поэтому в мурле это
### единственный член карточки, способный прилипнуть)
pin_fakehit = off
### 1..500 — «свежий урон» на заштыренного (нативные замеры: до ~499)
pin_fakehit_value = 150

