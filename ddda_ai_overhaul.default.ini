################################################################################
#####                    DDDA AI Overhaul Mod                              #####
#####              Place ddda_ai_overhaul.ini in the DDDA folder           #####
################################################################################

[main]
### Load additional library
###  - for chaining with other dinput8 mods
###  - set to the original dinput8 mod's dll name if you want both
loadLibrary = 

[hotkeys]
### Hotkeys — REQUIRED for F12 overlay to work!
###  - 'enabled'   - must be ON
###  - 'keyUI'     - F12 key code (0x7B = F12)
###  - 'menuPause' - delay in ms for menu hotkeys
enabled = on
keyUI = 0x7B
menuPause = 500

[pawnAI]
### Pawn AI Overhaul — модель весов v3.0
###  - 'enabled'         - master switch
###  - 'presetsEnabled'  - use anchors (sliders). OFF = weights freeze where they are
###  - 'acquisitor'      - soft manager for Acquisitor ONLY: suppressed in combat;
###                        after combat ends, temporarily boosted (loot vacuum),
###                        then smoothly returned home to the player's slider.
###                        Guardian/Nexus are doctrines now and are NOT capped.
###  - 'acquisitorCombatFloor'   - Acquisitor cap during combat (0..1000)
###  - 'acquisitorLootBoost'     - temporary post-combat boost (0..1000)
###  - 'acquisitorBoostWindowMs' - how long the post-combat boost lasts (ms)
###  - 'acquisitorReturnMs'      - how long the smooth return home takes (ms)
###  - 'smartUtil'       - adjust Utilitarian based on pawn knowledge (mStudyFlag)
###  - 'smooth'          - transition smoothness LERP (0.01=soft slow, 0.1=normal, 1.0=instant)
###  - 'tactical'        - auto-adapt: situational delta on top of your sliders (enemy category)
###  - 'lastPreset'      - which preset was loaded into the sliders last (UI indicator only)
###  Sliders ([customAnchor] below) are ALWAYS the truth. Presets just load into them.
enabled = on
presetsEnabled = on
acquisitor = on
acquisitorCombatFloor = 100.0
acquisitorLootBoost = 180.0
acquisitorBoostWindowMs = 8000
acquisitorReturnMs = 4000
###  - 'worldUnitsPerMeter' - scale of world coordinates (Guardian doctrine).
###                          DDDA world units are ~centimeters, so 100.0 = 1 m.
###                          Evidence: AIPlActParam action ranges 500..4000 and
###                          goblin vision sensor 1500 only make sense as cm.
###                          Exact factor TBD by touch-test; tune here if needed.
worldUnitsPerMeter = 100.0
###  - 'guardianFix' - Build 57.1: dynamic Guardian fix. OFF by default (vanilla).
###                   When ON, lifts Guardian -3 penalty on WpnDaggerAtk (code 54)
###                   transactionally, ONLY while a threat is in the Arisen's
###                   zone and the pawn is melee/hybrid. Rollback when zone clears.
###  - 'guardianMeleeRadius' - Build 57.3: melee intercept radius in meters.
###                   The fix only arms when the nearest threat is WITHIN this
###                   radius (dagger range). Beyond it the pawn keeps the bow
###                   (code 57 has no inclination penalties — SOURCE_OF_TRUTH §3.5.3).
###  - 'guardianPreemptRadius' - Build 58: bodyguard "preempt" zone (meters).
###                   Larger than melee radius. When nearest threat is inside
###                   this, the dagger penalty is removed (pawn "readies" melee)
###                   even before the enemy reaches melee range.
###  - 'guardianDaggerBiasMelee'   - desired AddS32 when threat in melee radius
###                   (default +2 = slight bonus, pawn commits to intercept).
###  - 'guardianDaggerBiasPreempt' - desired AddS32 when threat in preempt radius
###                   (default 0 = penalty removed, pawn readies).
guardianFix = off
guardianMeleeRadius = 6.0
guardianPreemptRadius = 10.0
guardianDaggerBiasMelee = 2
guardianDaggerBiasPreempt = 0
smartUtil = on
tactical = on
lastPreset = 5
smooth = 0.10

### --- Вокационный кордон Guardian --------------------------------------
### Guardian как доктрина телохранителя осмысленна только у ближнего боя.
### У лучника и кастера активный Guardian вреден: пешка прижимается к
### Аризену и стреляет из-за его спины, то есть тащит агро прямо на него.
###
###   Fighter / Warrior / Mystic Knight - не трогаем
###   Strider / Assassin                - частичный кордон
###   Ranger / Magick Archer            - полный кордон
###   Mage / Sorcerer                   - полный кордон
###
### Кордон задаёт ПОТОЛОК склонности, а не вычитает число: поставил
### Guardian ниже потолка сам — кордон молчит.
###
### Pioneer — грубый рычаг «не липни к якорю». Настоящее позиционирование
### (фланг, огонь из тыла) требует реверса цели Follow — отдельная задача.
vocationCordon = on
cordonGuardianCapRanged = 300
cordonPioneerFloorRanged = 650
cordonGuardianCapHybrid = 550
cordonPioneerFloorHybrid = 550

[customAnchor]
### Inclination anchors (0 - 1000) — THE current target. Always live in F12.
### Loading a preset copies its values here. Dragging a slider writes here.
scather = 750.0
medicant = 400.0
mitigator = 500.0
challenger = 700.0
utilitarian = 750.0
guardian = 350.0
nexus = 350.0
pioneer = 400.0
acquisitor = 250.0
skillUse = 700.0

[targetLock]
### Target Lock — автонаведение мили-атак по камере
###  - 'autoAim'    - snap melee attacks to camera direction
###  - Alt+X to capture player physics (once per session)
###  - NumPad Del (VK_DELETE 0x2E / VK_DECIMAL 0x6E) to toggle auto-aim (was F5)
autoAim = off

[camera_keys]
### Camera Plus + Pawn Cam hotkeys
###  - 'freeCam'  - toggle tactical camera (default MMB)
###  - 'pause'    - pause toggle (default Num 0)
###  - 'pawnCam'  - toggle Pawn Cam (camera follows pawn, default Num 1)
### Camera Plus — custom key bindings
### Virtual-Key Codes: https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
###   F4 = 0x73, MMB = 0x04, Num0 = 0x60, Num+ = 0x6B, Num- = 0x6D
###   Mouse buttons: LMB=0x01, RMB=0x02, MMB=0x04, X1=0x05, X2=0x06
###   Set to 0xFF to disable
freeCam = 0x04
pause   = 0x60
speedUp = 0x6B
speedDn = 0x6D
pawnCam = 0x61

[camera]
### Camera Plus — свободная камера + пауза
###  - 'freeCam'     - enable free camera (F4 toggle)
###  - 'detach'      - detach camera from player
###  - 'freeFly'     - enable free fly mode
###  - 'flySpeed'    - movement speed (arrows)
###  - 'flySpeedZ'   - vertical speed (PgUp/PgDn)
###  - 'pause'       - game pause toggle (Num 0)
###  - 'pauseSpeed'  - speed during pause (0.00001 = frozen, 0.1 = slow-mo)
freeCam = off
detach = off
freeFly = off
flySpeed = 2.0
flySpeedZ = 2.0
pause = off
pauseSpeed = 0.0001
### Party Cam — камера между Аризеном и пешкой (позиция blend, взгляд игрока)
###  - 'pawnCam'        - enable (toggle via camera_keys.pawnCam, default Num 1)
###  - 'pawnCamBias'    - где центр: 0=у Аризена, 0.5=посередине, 1=у пешки
###  - 'pawnCamHeight'  - camera height above target (cm)
###  - 'pawnCamFollow'  - Build 69.2: наша доля камеры за кадр. Движок пишет
###                     камеру параллельно с нами, поэтому это ВЕС в
###                     перетягивании, а не просто сглаживание. Выше ~0.05
###                     начинается гостинг, 1.0 = камера мечется.
###  - 'pawnCamBiasEase' - Build 69.1: скорость ПЕРЕЛЁТА между Аризеном и пешкой.
###                     Едет сама точка блендинга, поэтому вход в режим и выход
###                     из него теперь одинаково плавные. 0.002 = медленный
###                     дрейф, 0.20 = примерно как возврат камеры движком.
###                     За итерацию камеры (~5 мс).
pawnCam = off
pawnCamBias = 1.0
pawnCamHeight = 150.0
pawnCamFollow = 0.01
pawnCamBiasEase = 0.20

[combatIntel]
### Combat Intel — боевая разведка
###  - 'enabled'      - hook ALL damage events, track enemies in combat
###  - 'timeout'      - seconds before enemy considered "out of combat"
###  - hooks 3 damage signatures from dinput8 DamageLog
###  - WARNING: may conflict with DamageLog from original dinput8
enabled = on
timeout = 5

[enemyAI]
### Enemy AI Overhaul
###  - 'enabled'           - master switch
###  - 'aggression'        - aggression multiplier (1.0 = default, >1 = more aggressive)
###  - 'reactionSpeed'     - reaction speed multiplier
###  - 'maxAttackers'      - max enemies attacking simultaneously
###  - 'smarterTactics'    - enable smarter group tactics
enabled = on
aggression = 1.3
reactionSpeed = 1.2
maxAttackers = 5
smarterTactics = on

[nightmare]
### Nightmare Module — Bitterblack Gransys
###  After killing Daimon's second form, Gransys transforms:
###  - Eternal night falls upon the land
###  - Weather becomes dark and volcanic
###  - Gransys enemies are replaced with Bitterblack Isle variants
###  - 'enabled'        - master switch for this module
###  - 'triggered'      - set to 'on' after Daimon-2 kill (manual for now)
###  - 'eternalNight'   - lock time to night hours
###  - 'darkWeather'    - force volcanic/fog weather
###  - 'forcedHour'     - which night hour to lock (0-5)
###  - 'replaceEnemies' - swap Gransys enemies for BBI variants
enabled = off
triggered = off
eternalNight = on
darkWeather = on
forcedHour = 2
replaceEnemies = on

[devtools]
### Type Atlas / factory probe (F12 → DevTools)
### DEVELOPER TOOL — players should leave this OFF.
###
### Build 69: this flag NO LONGER affects the mod itself. Combat detection,
### Guardian doctrine, party positions and priority profiles live in
### src/runtime/ and always run. Turning devtools off only hides the
### research panel and its probes.
###  - 'enabled'   - show the research panel (SCAN/DUMP/HUNT/TypeAtlas)
###  - 'autoDump'  - write ddda_sunit_dump.json automatically
###  - 'researchDump' - write research JSON/CSV on "capture" (party_recon,
###                     pawn_ai_bridge, pawn_intent_trace). OFF by default —
###                     not needed for product work; enable only when hunting
###                     rare semantic codes.
### After load: SCAN (vtable map) then DUMP sUnit anatomy.
### DUMP writes ddda_sunit_dump.json — that is the file to paste.
### NOTE: код по умолчанию OFF, и поставляемый ini теперь тоже OFF.
### Разработчику: поставь enabled = on, чтобы вернуть панель.
### Build 69.6: раньше здесь стояло on — то есть у КАЖДОГО игрока
### открывалась исследовательская панель и писались авто-дампы, ради
### отключения которых и делался рефакторинг слоёв.
enabled = off
autoDump = off
researchDump = off

[monsterTempo]
### Вариативность темпа передвижения монстров.
###
### ЗАЧЕМ: игрок побеждает гоблина не потому, что тот слаб, а потому что
### выучил его ритм. Каждый монстр получает СВОЙ множитель скорости, поэтому
### стая подходит вразнобой и дистанцию выучить нельзя. Урон и HP не трогаются.
###
### Анимации НЕ меняются — меняется только скорость перемещения тушки.
### Тайминги атак (замах/удар/восстановление) остаются ванильными.
###
###  - 'enabled'    - включить режим
###  - 'factorMin' / 'factorMax' - диапазон множителей скорости. Каждому
###                   монстру достаётся своё значение внутри него, поэтому
###                   стая идёт вразнобой. Примеры:
###                     0.85 / 1.15  - разнобой вокруг ванили (по умолчанию)
###                     1.00 / 1.25  - все не медленнее ванили, кто-то шустрее
###                     0.80 / 1.05  - крадущаяся стая
###                   Жёсткие пределы 0.75 и 1.30 независимо от этих чисел:
###                   дальше заметно проскальзывание стоп и пробой коллизии.
###  - 'hookWalk'   - перехват обычного движения
###  - 'hookSprint' - перехват спринта. Выключать оба по отдельности можно
###                   для диагностики, но в норме нужны оба: иначе получится
###                   «шагом медленно, бегом быстро».
enabled = off
factorMin = 0.85
factorMax = 1.15
hookWalk = on
hookSprint = on

### ТЕМП АНИМАЦИИ — вторая, независимая ручка (найдена 19.08.2026).
###
### В теле существа лежит ряд из пяти множителей скорости воспроизведения
### (+0x0EE4…+0x0EF4). В норме каждый равен 1.0, торпор ставит 0.5. Мы
### умножаем на свой коэффициент, а не задаём абсолют, поэтому торпор,
### захват и прочие механики продолжают работать поверх нашей правки.
###
### Здесь меняется ИМЕННО ритм боя: замах, удар и восстановление. Самое
### слабое звено гоблина — долгий замах; вариативность темпа лишает игрока
### заученного окна для уворота.
###
### Множитель у каждой особи свой и не зависит от множителя передвижения,
### поэтому получаются четыре характера:
###     медленно ходит + медленно бьёт  - увалень
###     быстро ходит   + медленно бьёт  - наскок-отскок
###     медленно ходит + быстро бьёт    - засадный
###     быстро ходит   + быстро бьёт    - берсерк
###
### Жёсткие пределы 0.70 и 1.40 независимо от этих чисел: дальше окно
### уязвимости и хитбоксы оружия перестают читаться глазом.
### ВАЖНО ПРО ОБЛАСТЬ. Множитель воспроизведения ГЛОБАЛЕН для существа:
### сам по себе он ускоряет всё анимированное, включая ходьбу. Но скоростью
### ходьбы уже управляет хук передвижения выше, и две ручки крутили бы одно
### и то же.
###
### Поэтому 'animAttacksOnly = on' (по умолчанию): множитель применяется
### ТОЛЬКО пока текущее действие является атакой. Тогда ручки честно
### разделены:
###     factorMin/Max      - как быстро монстр перемещается;
###     animFactorMin/Max  - как быстро он замахивается и бьёт.
### Выключать стоит только для экспериментов «весь монстр в ускорении».
animEnabled = off
animAttacksOnly = on
animFactorMin = 0.90
animFactorMax = 1.15

### СВЯЗКА ХАРАКТЕРА: 0.0 … 1.0.
###
### Полная независимость ручек даёт четыре характера, но и несуразицу:
### гоблин-спринтер с ванильным замахом читается как «быстро прибежал и
### застыл». Связка задаёт, в какой мере темп атаки следует за скоростью
### передвижения ТОЙ ЖЕ особи:
###     0.0 - ручки независимы (четыре характера);
###     1.0 - кто быстро бегает, тот быстро и бьёт (цельное существо);
###     0.5 - смесь.
animCoupling = 0.00

[pawnHaste]
### Рывок пешки в бою.
###
### ПРОБЛЕМА. У пешек в бою нет спринта вообще. Причина найдена в данных:
### даш существует отдельным действием GOAP, но привязан только к цели
### Follow (догнать Аризена) и к Escape. На боевых целях его нет —
### планировщику нечего выбрать. См. docs/PAWN_SPRINT_RECON.md.
###
### ЧТО ДЕЛАЕМ. Планировщик не трогаем. Пока пешка закрывает дистанцию до
### врага, ей поднимается тот же множитель ПЕРЕДВИЖЕНИЯ, что и монстрам.
###
### ЧЕСТНО: это подделка. Анимация остаётся джогом, ускоряется только
### перемещение тушки. Поэтому потолок 1.30 — дальше видно проскальзывание.
###
###  - 'factor'        - множитель скорости на время рывка
###  - 'minDistanceM'  - ближе этого рывок не нужен: пешка уже в контакте
###  - 'maxDistanceM'  - дальше это уже не бой, а переход, и там у пешки
###                      работает штатный даш по цели Follow
###
### СВЯЗКА АНИМАЦИИ ('animCouple'). Замечание тестера: у монстров мы умеем
### ускорять И перемещение, И анимацию — ряд множителей воспроизведения
### +0x0EE4…+0x0EF4. Если тот же ряд есть в теле пешки, проскальзывание
### стоп лечится: анимация бега ускоряется вместе с перемещением.
###
### Порядок безопасный:
###   1. при первом рывке ряд ЧИТАЕТСЯ и вердикт печатается в лог
###      («Tempo: anim row probe uCmc ... -> ...»), запись при этом не
###      выполняется вообще;
###   2. запись включается только этим флагом И только если все пять
###      полей были ровно 1.0 (ряд на месте и в покое);
###   3. когда рывок кончается, исходные значения возвращаются.
###
### Вердикт получен на живой пешке (ряд есть, поле [0] — темп
### передвижения), запись сужена до этого поля и до состояний движения,
### исходные значения возвращаются. Поэтому по умолчанию ON: выключенная
### связка — это заведомо худший вариант с широкими шагами.
###
### КОМПЕНСАЦИЯ, А НЕ БАФФ ('matchMonsterTempo'). Модуль существует
### потому, что монстров ускорили МЫ. Значит и число правильно брать у
### них: при включённом флаге множитель равен множителю самого быстрого
### врага поблизости, а если монстры бегут ванильно — компенсации нет
### вовсе. 'factor' в этом режиме не используется.
enabled = off
factor = 1.20
minDistanceM = 5.0
maxDistanceM = 40.0
animCouple = on
matchMonsterTempo = on
###
### ПРИЗНАК БОЯ У САМОЙ ПЕШКИ ('requireWeaponDrawn'). «Враг в радиусе» —
### грубая метка: враги за стеной, которых партия не видит, включали
### ускорение. У пешки есть свой признак: состояния с обнажённым оружием
### (cPlActHoldWeaponMv при движении, семейство cPlActWpn* при ударах).
### Гейт: обнажённое оружие ИЛИ подтверждение детектора боя.
requireWeaponDrawn = on

[monsterAI]
### Режиссёр стороны монстров.
###
### Симметричен слою пешек: читает ту же шину (CombatBus) и управляет
### своими примитивами — темпом, размером и тем, что появится дальше.
### Сам в память игры не пишет НИКОГДА: только читает бой и раздаёт
### указания примитивам. Поэтому его ошибка выглядит как неверное
### решение, а не как вылет.
###
### Сейчас это НАБЛЮДАТЕЛЬ: политик нет, записи нет. Включать имеет смысл,
### чтобы посмотреть в панели, правильно ли он видит бой.
enabled = off

[inGameUI]
### In-game UI overlay (F12)
enabled = on

